<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント施策投稿フォーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9ff; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .accent-purple { background-color: #f3f0ff; border: 1px solid #e9e4ff; }
        input[type="radio"]:checked + span { background-color: #8b5cf6; color: white; border-color: #8b5cf6; }
        .loading { opacity: 0.5; pointer-events: none; }
        
        /* 完了アニメーション用 */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .success-overlay { animation: popIn 0.3s ease-out; }
    </style>
</head>
<body class="p-4 pb-12">

    <div id="app" class="max-w-md mx-auto relative">
        <div id="successMessage" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-white/90 backdrop-blur-sm">
            <div class="success-overlay bg-white p-8 rounded-3xl card-shadow border border-purple-100 text-center w-full max-w-xs">
                <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-800 mb-2">送信完了！</h2>
                <p class="text-sm text-gray-500 mb-6">施策内容を無事に保存しました。</p>
                <button onclick="resetForm()" class="w-full py-3 bg-purple-600 text-white rounded-xl font-bold shadow-md">
                    続けて投稿する
                </button>
            </div>
        </div>

        <div class="mb-6 flex items-center gap-2 text-lg font-bold text-gray-700">
            <span class="text-pink-500">📌</span>
            <h1>施策内容の登録</h1>
        </div>

        <form id="promoForm" class="space-y-4">
            <div class="bg-white p-5 rounded-2xl card-shadow border border-gray-100 space-y-3">
                <div class="flex items-center gap-2 mb-1 font-bold text-gray-800 text-sm">
                    <i class="fa-solid fa-user-pen text-blue-400"></i> 基本情報
                </div>
                <input type="text" id="staff_name" placeholder="お名前" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400 text-sm" required>
                <input type="text" id="event_name" placeholder="イベント名" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400 text-sm" required>
                <input type="text" id="store_name" placeholder="店舗名・会場" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400 text-sm">
            </div>

            <div class="accent-purple p-5 rounded-3xl card-shadow space-y-4">
                <div class="flex items-center gap-2 font-bold text-gray-800 text-sm">
                    <span>🎁</span> 特典・券面設定
                </div>
                <div class="space-y-3">
                    <p class="text-xs font-bold text-gray-600 px-1">コンテンツ関連の券面はある？</p>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="cursor-pointer"><input type="radio" name="has_special_design" value="true" class="hidden"><span class="block text-center p-3 bg-white border border-gray-200 rounded-xl text-sm font-medium transition-all">あり</span></label>
                        <label class="cursor-pointer"><input type="radio" name="has_special_design" value="false" class="hidden" checked><span class="block text-center p-3 bg-white border border-gray-200 rounded-xl text-sm font-medium transition-all">なし</span></label>
                    </div>
                    <p class="text-xs font-bold text-gray-600 px-1 mt-3">カード入会特典はある？</p>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="cursor-pointer"><input type="radio" name="has_signup_bonus" value="true" class="hidden"><span class="block text-center p-3 bg-white border border-gray-200 rounded-xl text-sm font-medium transition-all">あり</span></label>
                        <label class="cursor-pointer"><input type="radio" name="has_signup_bonus" value="false" class="hidden" checked><span class="block text-center p-3 bg-white border border-gray-200 rounded-xl text-sm font-medium transition-all">なし</span></label>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl card-shadow border border-gray-100 overflow-hidden">
                <div class="p-4">
                    <label class="flex items-center gap-2 text-sm font-bold text-gray-700 mb-2"><i class="fa-solid fa-comment-dots text-orange-400"></i> フック内容</label>
                    <textarea id="hook_content" rows="3" placeholder="最初の声掛け" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none text-sm"></textarea>
                </div>
                <div class="bg-gray-50 p-3 border-t border-dashed border-gray-200">
                    <label class="flex items-center justify-center gap-2 cursor-pointer py-2 px-4 bg-white border border-gray-300 rounded-lg text-xs font-bold text-gray-600 active:bg-gray-100">
                        <i class="fa-solid fa-camera"></i> 写真を追加
                        <input type="file" id="hook_image" accept="image/*" class="hidden">
                    </label>
                    <div id="hook_preview" class="hidden mt-2 text-[10px] text-blue-500 text-center italic font-bold tracking-wider">画像セット完了</div>
                </div>
            </div>

            <div class="bg-white rounded-2xl card-shadow border border-gray-100 overflow-hidden">
                <div class="p-4">
                    <label class="flex items-center gap-2 text-sm font-bold text-gray-700 mb-2"><i class="fa-solid fa-bullhorn text-green-400"></i> ひきこみ内容</label>
                    <textarea id="pitch_content" rows="3" placeholder="メリットの伝え方" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none text-sm"></textarea>
                </div>
                <div class="bg-gray-50 p-3 border-t border-dashed border-gray-200">
                    <label class="flex items-center justify-center gap-2 cursor-pointer py-2 px-4 bg-white border border-gray-300 rounded-lg text-xs font-bold text-gray-600 active:bg-gray-100">
                        <i class="fa-solid fa-image"></i> 写真を追加
                        <input type="file" id="pitch_image" accept="image/*" class="hidden">
                    </label>
                    <div id="pitch_preview" class="hidden mt-2 text-[10px] text-blue-500 text-center italic font-bold tracking-wider">画像セット完了</div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl card-shadow border border-gray-100">
                <textarea id="memo" rows="2" placeholder="ほかになにかあれば" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none text-sm"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                <span>登録する</span>
            </button>
        </form>
    </div>

    <script>
        // --- Supabase設定 (ここを書き換えてください) ---
        const SUPABASE_URL = 'https://xxtqtvacrrshbslsnnvx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4dHF0dmFjcnJzaGJzbHNubnZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NTY3MzEsImV4cCI6MjA4MzQzMjczMX0.YKnc2YMNR2VEtXIfCeZTsqu1ielPY002iFQtGRWIMQs';
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('promoForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');

        // ファイル選択プレビュー
        ['hook_image', 'pitch_image'].forEach(id => {
            document.getElementById(id).addEventListener('change', e => {
                const preview = document.getElementById(`${id}_preview`);
                if (e.target.files.length > 0) preview.classList.remove('hidden');
            });
        });

        // 送信完了後のリセット処理
        function resetForm() {
            form.reset();
            successMessage.classList.add('hidden');
            document.getElementById('hook_preview').classList.add('hidden');
            document.getElementById('pitch_preview').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 保存処理
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.classList.add('loading');
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 送信中...';

            try {
                const uploadImg = async (fileInputId) => {
                    const file = document.getElementById(fileInputId).files[0];
                    if (!file) return null;
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 15)}.${fileExt}`;
                    const filePath = `uploads/${fileName}`;
                    
                    let { error: uploadError } = await supabase.storage
                        .from('event-photos')
                        .upload(filePath, file);

                    if (uploadError) throw uploadError;
                    return filePath;
                };

                const hookImgPath = await uploadImg('hook_image');
                const pitchImgPath = await uploadImg('pitch_image');

                const { error } = await supabase
                    .from('event_promotions')
                    .insert([{
                        staff_name: document.getElementById('staff_name').value,
                        event_name: document.getElementById('event_name').value,
                        store_name: document.getElementById('store_name').value,
                        has_special_design: document.querySelector('input[name="has_special_design"]:checked').value === 'true',
                        has_signup_bonus: document.querySelector('input[name="has_signup_bonus"]:checked').value === 'true',
                        hook_content: document.getElementById('hook_content').value,
                        pitch_content: document.getElementById('pitch_content').value,
                        hook_image_url: hookImgPath,
                        pitch_image_url: pitchImgPath,
                        memo: document.getElementById('memo').value
                    }]);

                if (error) throw error;

                // 完了画面を表示
                successMessage.classList.remove('hidden');

            } catch (err) {
                console.error(err);
                alert('エラーが発生しました: ' + err.message);
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.innerHTML = '<span>登録する</span>';
            }
        });
    </script>
</body>
</html>
